<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#130605">
  <meta name="description" content="2026 COP 활동을 마무리하는 30초 애니메이션 단편. 선물 상자를 열어보세요.">
  <title>2026 COP 활동 마무리</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23511918'/%3E%3Cpath d='M7 17h26v17H7zM5 13h30v6H5z' fill='%23c98b42'/%3E%3Cpath d='M20 13v21M20 12c-12 1-12-9-5-7 3 1 5 7 5 7s2-6 5-7c7-2 7 8-5 7Z' fill='none' stroke='%23fff0bc' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="preload" as="image" href="stage.webp">
  <link rel="stylesheet" href="stage.css?v=3">
  <script src="nav.js" defer></script>
  <script src="stage.js" defer></script>
</head>
<body>
  <main class="theatre" aria-labelledby="film-title">
    <div class="scenery">
      <img class="stage-image" src="stage.webp" width="1672" height="941" alt="">
      <button class="gift" type="button" aria-label="클릭해보세요. 30초 COP 영상 재생" aria-haspopup="dialog" aria-controls="screening">
        <span class="gift-outline" aria-hidden="true"></span>
        <span class="invitation" aria-hidden="true"><span>클릭해보세요</span><span class="invitation-arrow">↗</span></span>
      </button>
      <div class="light-burst" aria-hidden="true"></div>
    </div>
    <div class="frame" aria-hidden="true"></div>
    <header class="marquee">
      <nav class="site-nav" aria-label="COP 메뉴">
        <button class="company" type="button" aria-expanded="false" aria-controls="cop-nav-links">
          COP <span class="company-year">2026</span><span class="nav-arrow" aria-hidden="true"></span>
        </button>
        <div class="nav-panel" id="cop-nav-links" hidden>
          <ul>
            <li><a href="names.html">2026 함께한 이름들</a></li>
            <li><a href="agenda.html">2027 논의 사항</a></li>
          </ul>
        </div>
      </nav>
      <time datetime="2026-11-23">2026.11.23</time>
    </header>
    <div class="film-title">
      <h1 id="film-title">2026 COP 활동 마무리</h1>
      <p class="film-reveal">꽤 많이 달렸다</p>
    </div>
    <p class="runtime"><span aria-hidden="true"></span>by.홍<span aria-hidden="true"></span></p>
    <div class="curtains" aria-hidden="true">
      <div class="curtain curtain-left"></div>
      <div class="curtain curtain-right"></div>
    </div>
    <noscript><a class="no-script" href="finale.mp4">30초 영상 바로 보기</a></noscript>
  </main>

  <dialog id="screening" class="screening" aria-labelledby="screening-title">
    <div class="screen">
      <div class="screen-bar">
        <h2 id="screening-title">아주 가끔은, 꽤 많이 달렸다</h2>
        <button class="close" type="button" aria-label="영상 닫기" autofocus>×</button>
      </div>
      <div class="playback">
        <video playsinline controls preload="metadata" aria-label="2026 COP 활동 종료 영상">
          <source src="finale.mp4" type="video/mp4">
        </video>
        <button class="start-playback" type="button" hidden>영상 재생</button>
        <p class="video-error" role="status" hidden>영상을 불러오지 못했어요. <a href="finale.mp4">MP4 열기</a></p>
      </div>
    </div>
  </dialog>
</body>
</html>
